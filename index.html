<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Asteroid Shooter AR</title>

<script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>

<script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>

<style>

html,body{
    margin:0;
    overflow:hidden;
    width:100%;
    height:100%;
    font-family:Arial;
}

#hud{
    position:fixed;
    top:10px;
    left:10px;
    z-index:10;
    color:white;
    background:rgba(0,0,0,.5);
    padding:10px;
    border-radius:8px;
}

#menu{
    position:fixed;
    inset:0;
    z-index:20;
    display:flex;
    justify-content:center;
    align-items:center;
    background:rgba(0,0,0,.85);
}

.panel{
    width:320px;
    background:#111827;
    color:white;
    padding:25px;
    border-radius:12px;
    text-align:center;
}

button{
    width:100%;
    padding:14px;
    margin-top:15px;
    border:none;
    border-radius:8px;
    background:#38bdf8;
    color:black;
    font-weight:bold;
    font-size:16px;
}

</style>
</head>

<body>

<div id="hud">
    Score:
    <span id="score">0</span>
    <br>
    Life:
    <span id="life">5</span>
</div>

<div id="menu">
    <div class="panel">

        <h1>Asteroid Shooter AR</h1>

        <p>
            Aim at asteroids using the center cursor.
        </p>

        <p>
            Hold the cursor on the asteroid to destroy it.
        </p>

        <button id="startBtn">
            Start Game
        </button>

    </div>
</div>

<a-scene
    embedded
    arjs="sourceType: webcam;"

    vr-mode-ui="enabled:false"

    renderer="
        logarithmicDepthBuffer:true;
        antialias:true;
        alpha:true;
    "

>

    <a-camera position="0 0 0">

        <!-- CENTER CURSOR -->
        <a-cursor

            fuse="true"
            fuse-timeout="700"

            color="#00FFFF"

            geometry="
                primitive:ring;
                radiusInner:0.01;
                radiusOuter:0.02;
            "

            material="
                color:#00FFFF;
                shader:flat;
            "

        ></a-cursor>

    </a-camera>

    <a-entity
        light="type:ambient; intensity:1.5">
    </a-entity>

    <a-entity id="asteroidContainer"></a-entity>

</a-scene>

<script>

const container =
document.getElementById("asteroidContainer");

const scoreText =
document.getElementById("score");

const lifeText =
document.getElementById("life");

let score = 0;
let life = 5;
let playing = false;

function createAsteroid(){

    if(!playing) return;

    const asteroid =
    document.createElement("a-sphere");

    asteroid.classList.add("asteroid");

    const x =
    (Math.random()*4)-2;

    const y =
    (Math.random()*3)-1;

    const z =
    -8;

    asteroid.setAttribute(
        "position",
        `${x} ${y} ${z}`
    );

    asteroid.setAttribute(
        "radius",
        Math.random()*0.3+0.25
    );

    asteroid.setAttribute(
        "color",
        "#888888"
    );

    asteroid.setAttribute(
        "segments-width",
        "12"
    );

    asteroid.setAttribute(
        "segments-height",
        "12"
    );

    asteroid.setAttribute(
        "animation",
        `
        property: position;
        to: 0 0 -1;
        dur: 4000;
        easing: linear;
        `
    );

    // GAZE DESTROY
    asteroid.addEventListener("mouseenter",()=>{

        destroyAsteroid(asteroid);

    });

    container.appendChild(asteroid);

    setTimeout(()=>{

        if(container.contains(asteroid)){

            container.removeChild(asteroid);

            loseLife();

        }

    },4000);

}

function destroyAsteroid(asteroid){

    if(!container.contains(asteroid))
    return;

    asteroid.setAttribute(
        "animation__scale",
        `
        property: scale;
        to: 0 0 0;
        dur: 200;
        `
    );

    setTimeout(()=>{

        if(container.contains(asteroid)){

            container.removeChild(asteroid);

        }

    },200);

    score++;

    scoreText.textContent =
    score;

}

function loseLife(){

    if(!playing) return;

    life--;

    lifeText.textContent =
    life;

    if(life <= 0){

        endGame();

    }

}

function endGame(){

    playing = false;

    alert(
        "Game Over!\nScore: "
        + score
    );

    location.reload();

}

document
.getElementById("startBtn")
.addEventListener("click",()=>{

    document
    .getElementById("menu")
    .style.display = "none";

    playing = true;

    setInterval(()=>{

        if(playing){

            createAsteroid();

        }

    },1000);

});

</script>

</body>
</html>
