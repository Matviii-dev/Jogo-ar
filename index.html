<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="
        width=device-width,
        initial-scale=1.0,
        maximum-scale=1.0,
        user-scalable=no
    "
>

<title>Asteroid Shooter</title>

<!-- AFRAME -->
<script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>

<!-- ARJS -->
<script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>

<style>

html,body{
    margin:0;
    overflow:hidden;
    width:100%;
    height:100%;
    background:black;
    font-family:Arial;
}

/* HUD */

#hud{
    position:fixed;
    top:10px;
    left:10px;
    z-index:10;

    color:white;

    background:rgba(0,0,0,.6);

    padding:12px;

    border-radius:8px;

    line-height:1.5;
}

/* MENU */

#menu{
    position:fixed;

    inset:0;

    z-index:20;

    display:flex;

    justify-content:center;

    align-items:center;

    background:rgba(0,0,0,.85);
}

.panel{

    width:340px;

    background:#111827;

    color:white;

    padding:25px;

    border-radius:12px;

    text-align:center;
}

button{

    width:100%;

    padding:14px;

    margin-top:15px;

    border:none;

    border-radius:8px;

    background:#38bdf8;

    color:black;

    font-size:16px;

    font-weight:bold;

    cursor:pointer;
}

</style>

</head>

<body>

<!-- HUD -->

<div id="hud">

    Score:
    <span id="score">0</span>

    <br>

    Life:
    <span id="life">5</span>

    <br>

    Mode:
    <span id="modeText">None</span>

</div>

<!-- MENU -->

<div id="menu">

    <div class="panel">

        <h1>Asteroid Shooter</h1>

        <p>
            Choose a game mode.
        </p>

        <!-- AR BUTTON -->

        <button id="arBtn">

            AR MODE

        </button>

        <!-- PC BUTTON -->

        <button id="pcBtn">

            PC MODE

        </button>

    </div>

</div>

<!-- AR SCENE -->

<a-scene

    id="scene"

    embedded

    vr-mode-ui="enabled:false"

    renderer="
        logarithmicDepthBuffer:true;
        antialias:true;
        alpha:true;
    "

>

    <!-- LIGHT -->

    <a-entity
        light="
            type:ambient;
            intensity:1.5;
        ">
    </a-entity>

    <!-- SKY FOR PC MODE -->

    <a-sky
        id="sky"
        color="#000814"
        visible="false">
    </a-sky>

    <!-- MARKER -->

    <a-marker
        id="marker"
        preset="hiro"
        visible="false">

        <a-entity id="asteroidContainer"></a-entity>

    </a-marker>

    <!-- PC CONTAINER -->

    <a-entity
        id="pcContainer"
        visible="false">

        <a-entity id="pcAsteroids"></a-entity>

    </a-entity>

    <!-- CAMERA -->

    <a-entity
        camera
        look-controls>

        <a-cursor

            fuse="true"

            fuse-timeout="700"

            color="#00FFFF"

            geometry="
                primitive:ring;
                radiusInner:0.01;
                radiusOuter:0.02;
            "

            material="
                color:#00FFFF;
                shader:flat;
            "

        ></a-cursor>

    </a-entity>

</a-scene>

<script>

/* ELEMENTS */

const marker =
document.getElementById("marker");

const sky =
document.getElementById("sky");

const modeText =
document.getElementById("modeText");

const arBtn =
document.getElementById("arBtn");

const pcBtn =
document.getElementById("pcBtn");

const asteroidContainer =
document.getElementById("asteroidContainer");

const pcContainer =
document.getElementById("pcContainer");

const pcAsteroids =
document.getElementById("pcAsteroids");

const scoreText =
document.getElementById("score");

const lifeText =
document.getElementById("life");

/* GAME STATE */

let score = 0;
let life = 5;
let playing = false;
let mode = "none";

/* START AR MODE */

arBtn.addEventListener("click",()=>{

    mode = "AR";

    modeText.textContent =
    "AR";

    document
    .getElementById("menu")
    .style.display = "none";

    marker.setAttribute(
        "visible",
        true
    );

    document
    .querySelector("a-scene")
    .setAttribute(
        "arjs",
        `
        sourceType: webcam;
        debugUIEnabled: false;
        `
    );

    playing = true;

    startSpawner();

});

/* START PC MODE */

pcBtn.addEventListener("click",()=>{

    mode = "PC";

    modeText.textContent =
    "PC";

    document
    .getElementById("menu")
    .style.display = "none";

    sky.setAttribute(
        "visible",
        true
    );

    pcContainer.setAttribute(
        "visible",
        true
    );

    playing = true;

    startSpawner();

});

/* SPAWNER */

function startSpawner(){

    setInterval(()=>{

        if(playing){

            createAsteroid();

        }

    },1000);

}

/* CREATE ASTEROID */

function createAsteroid(){

    const asteroid =
    document.createElement("a-sphere");

    asteroid.classList.add("asteroid");

    let x,y,z;

    /* AR MODE */

    if(mode === "AR"){

        x = (Math.random()*3)-1.5;
        y = (Math.random()*2)+0.3;
        z = (Math.random()*-3)-2;

    }

    /* PC MODE */

    if(mode === "PC"){

        x = (Math.random()*8)-4;
        y = (Math.random()*4)-1;
        z = -10;

    }

    asteroid.setAttribute(
        "position",
        `${x} ${y} ${z}`
    );

    asteroid.setAttribute(
        "radius",
        Math.random()*0.2+0.15
    );

    asteroid.setAttribute(
        "color",
        "#888888"
    );

    asteroid.setAttribute(
        "segments-width",
        "12"
    );

    asteroid.setAttribute(
        "segments-height",
        "12"
    );

    /* MOVEMENT */

    if(mode === "AR"){

        asteroid.setAttribute(
            "animation",
            `
            property: position;
            to: 0 0 0;
            dur: 4000;
            easing: linear;
            `
        );

    }

    if(mode === "PC"){

        asteroid.setAttribute(
            "animation",
            `
            property: position;
            to: 0 1.6 0;
            dur: 5000;
            easing: linear;
            `
        );

    }

    /* DESTROY */

    asteroid.addEventListener(
        "mouseenter",
        ()=>{

            destroyAsteroid(asteroid);

        }
    );

    /* ADD */

    if(mode === "AR"){

        asteroidContainer
        .appendChild(asteroid);

    }

    if(mode === "PC"){

        pcAsteroids
        .appendChild(asteroid);

    }

    /* REMOVE */

    setTimeout(()=>{

        if(
            asteroid.parentNode
        ){

            asteroid.parentNode
            .removeChild(asteroid);

            loseLife();

        }

    },5000);

}

/* DESTROY ASTEROID */

function destroyAsteroid(asteroid){

    if(!asteroid.parentNode)
    return;

    asteroid.setAttribute(
        "animation__scale",
        `
        property: scale;
        to: 0 0 0;
        dur: 200;
        `
    );

    setTimeout(()=>{

        if(asteroid.parentNode){

            asteroid.parentNode
            .removeChild(asteroid);

        }

    },200);

    score++;

    scoreText.textContent =
    score;

}

/* LOSE LIFE */

function loseLife(){

    if(!playing) return;

    life--;

    lifeText.textContent =
    life;

    if(life <= 0){

        endGame();

    }

}

/* GAME OVER */

function endGame(){

    playing = false;

    alert(
        "Game Over!\nScore: "
        + score
    );

    location.reload();

}

</script>

</body>
</html>
