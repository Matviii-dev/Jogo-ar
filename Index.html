<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">


<title>Asteroid Shooter AR</title>


<!-- A-Frame -->
<script src="https://aframe.io/releases/1.7.0/aframe.min.js"></script>


<!-- AR.js -->
<script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>


<style>
html, body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    font-family:Arial;
}


#hud{
    position:fixed;
    top:15px;
    left:15px;
    z-index:10;
    color:white;
    background:rgba(0,0,0,.6);
    padding:12px;
    border-radius:8px;
    line-height:1.5;
}


#menu{
    position:fixed;
    inset:0;
    display:flex;
    justify-content:center;
    align-items:center;
    background:rgba(0,0,0,.85);
    z-index:20;
}


.panel{
    width:350px;
    background:#111827;
    color:white;
    padding:24px;
    border-radius:10px;
    text-align:center;
    border:1px solid #38bdf8;
}


button{
    width:100%;
    padding:12px;
    margin-top:16px;
    border:none;
    border-radius:6px;
    background:#38bdf8;
    font-weight:bold;
    cursor:pointer;
}
</style>
</head>


<body>


<div id="hud">
    Pontos: <span id="score">0</span><br>
    Vida: <span id="life">5</span>
</div>


<div id="menu">
    <div class="panel">
        <h1>Asteroid Shooter AR</h1>


        <p>
            Aponte o celular para o ambiente real.
        </p>


        <p>
            Toque nos asteroides para destruí-los.
        </p>


        <button id="startBtn">
            Iniciar
        </button>
    </div>
</div>


<!-- AR Scene -->
<a-scene
    embedded
    arjs="sourceType: webcam; debugUIEnabled: false;"
    vr-mode-ui="enabled: false"
    renderer="logarithmicDepthBuffer: true;">


    <!-- Camera -->
    <a-camera
        position="0 0 0"
        look-controls-enabled="false">


        <a-cursor
            color="#38bdf8"
            fuse="true"
            fuse-timeout="700">
        </a-cursor>


    </a-camera>


    <!-- Light -->
    <a-entity
        light="type: ambient; intensity: 1">
    </a-entity>


    <!-- Asteroids container -->
    <a-entity id="asteroidContainer"></a-entity>


</a-scene>


<script>


const container =
document.getElementById("asteroidContainer");


const scoreText =
document.getElementById("score");


const lifeText =
document.getElementById("life");


let score = 0;
let life = 5;
let playing = false;


function createAsteroid(){


    if(!playing) return;


    const asteroid =
    document.createElement("a-sphere");


    asteroid.classList.add("asteroid");


    // Random position in front of camera
    const x = (Math.random() * 4) - 2;
    const y = (Math.random() * 3);
    const z = -5;


    asteroid.setAttribute(
        "position",
        `${x} ${y} ${z}`
    );


    asteroid.setAttribute(
        "radius",
        (Math.random() * 0.3 + 0.2)
    );


    asteroid.setAttribute(
        "color",
        "#6b7280"
    );


    asteroid.setAttribute(
        "segments-height",
        "10"
    );


    asteroid.setAttribute(
        "segments-width",
        "10"
    );


    // Move asteroid toward player
    asteroid.setAttribute(
        "animation",
        `
        property: position;
        to: 0 0 -1;
        dur: 3500;
        easing: linear
        `
    );


    // Destroy on tap
    asteroid.addEventListener("click",()=>{


        if(!playing) return;


        destroyAsteroid(asteroid);


    });


    container.appendChild(asteroid);


    // If asteroid survives
    setTimeout(()=>{


        if(container.contains(asteroid)){


            container.removeChild(asteroid);


            loseLife();


        }


    },3500);
}


function destroyAsteroid(asteroid){


    if(container.contains(asteroid)){


        asteroid.setAttribute(
            "animation",
            `
            property: scale;
            to: 0 0 0;
            dur: 250
            `
        );


        setTimeout(()=>{


            if(container.contains(asteroid)){


                container.removeChild(asteroid);


            }


        },250);


        score++;


        scoreText.textContent = score;
    }
}


function loseLife(){


    if(!playing) return;


    life--;


    lifeText.textContent = life;


    if(life <= 0){


        endGame();
    }
}


function endGame(){


    playing = false;


    alert(
        "Fim de jogo!\nPontuação: " + score
    );


    location.reload();
}


document
.getElementById("startBtn")
.addEventListener("click",()=>{


    document
    .getElementById("menu")
    .style.display = "none";


    playing = true;


    setInterval(()=>{


        if(playing){


            createAsteroid();


        }


    },1000);
});


</script>


</body>
</html>
